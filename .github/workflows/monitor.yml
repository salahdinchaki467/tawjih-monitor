name: University Scraper Bot

on:
  schedule:
    # تشغيل البوت كل 30 دقيقة مثلاً (لتفادي الضغط وتكرار التشغيل)
    - cron: '*/30 * * * *'
  workflow_dispatch: # لإمكانية تشغيله يدوياً فـ أي وقت

# 1️⃣ منع تشغيل أكثر من RUN فـ نفس الوقت
concurrency:
  group: scraper-bot
  cancel-in-progress: true

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf google-generativeai urllib3

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python monitor.py
      # 2️⃣ حفظ التغييرات فـ state.json ودفعها للمستودع (Repository)
      - name: Commit and Push Updated state.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json
          git commit -m "Auto-update state.json [skip ci]" || exit 0
          git push
